# 비밀값·계정 ID·엔드포인트는 여기에 쓰지 않는다. image 와 inboundCIDRs 는 Git 제외 파일(runtime.local.yaml)에서 준다.
name: api
replicas: 1
# 반드시 <저장소>@sha256:<digest> (ECR clothes-query-dev/was 는 IMMUTABLE)
image: ""
resources:
  requests: {cpu: "250m", memory: "256Mi"}
  limits: {cpu: "500m", memory: "512Mi"}
nodePool: clothes-query-dev-compute
env:
  logLevel: INFO
  poolMax: 10
  poolTimeoutSeconds: 2
  clickTopic: clickstream
  kafkaBootstrap: clothes-query-dev-kafka-kafka-bootstrap.kafka.svc:9093
# 미리 만들어 두는 Secret 이름 (README 의 순서대로 사용자가 만든다)
secrets:
  database: api-database   # 키: host, database, username, password
  rdsCa: rds-ca            # 키: bundle.pem
  kafkaClient: kafka-client  # 키: ca.crt, user.crt, user.key (kafka namespace 에서 복사)
ingress:
  enabled: true
  className: api-internal-alb
  # 내부 ALB 에 들어올 수 있는 대역. 처음엔 VPC 대역, ECS SG 가 생기면 좁힌다. 비우면 렌더 실패.
  inboundCIDRs: []

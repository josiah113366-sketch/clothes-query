# 비밀값·계정 ID·엔드포인트는 여기에 쓰지 않는다. image 와 inboundCIDRs 는 Git 제외 파일(runtime.local.yaml)에서 준다.
name: api
replicas: 1
# 반드시 <저장소>@sha256:<digest> (ECR clothes-query-dev/was 는 IMMUTABLE)
image: ""
# 전용 노드(t3a.medium 2 vCPU)를 거의 혼자 쓴다. Python 프로세스 하나는 약 1코어까지만 쓴다.
resources:
  requests: {cpu: "500m", memory: "256Mi"}
  limits: {cpu: "1500m", memory: "1Gi"}
# API 전용 노드 풀. 기존 풀(clothes-query-dev-compute, Kafka 등)은 건드리지 않는다.
# 기존 NodeClass(같은 app 서브넷·클러스터 보안 그룹)를 같이 쓰므로 RDS 5432 규칙이 그대로 적용된다.
nodePool:
  create: true
  name: clothes-query-dev-api
  nodeClass: clothes-query-dev-compute
  instanceTypes: [t3a.medium]
  zones: [ap-northeast-1a, ap-northeast-1c]
  # cpu 한도 2 = t3a.medium 한 대. 노드가 2대 이상 생기지 않는다(비용 상한)
  cpuLimit: "2"
  memoryLimit: 4Gi
  taintKey: clothes-query/dedicated
env:
  logLevel: INFO
  poolMax: 10
  poolTimeoutSeconds: 2
  clickTopic: clickstream
  kafkaBootstrap: clothes-query-dev-kafka-kafka-bootstrap.kafka.svc:9093
# 미리 만들어 두는 Secret 이름 (README 의 순서대로 사용자가 만든다)
secrets:
  database: api-database   # 키: host, database, username, password
  rdsCa: rds-ca            # 키: bundle.pem
  kafkaClient: kafka-client  # 키: ca.crt, user.crt, user.key (kafka namespace 에서 복사)
ingress:
  enabled: true
  className: api-internal-alb
  # 내부 ALB 에 들어올 수 있는 대역. 처음엔 VPC 대역, ECS SG 가 생기면 좁힌다. 비우면 렌더 실패.
  inboundCIDRs: []

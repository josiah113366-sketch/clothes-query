{{- if .Values.nodePool.create }}
# EKS Auto Mode(Karpenter) 노드 풀. API Pod만 taint 를 허용하므로 다른 Pod는 이 노드에 오지 않는다.
# helm uninstall 하면 이 풀과 노드도 지워진다.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: {{ .Values.nodePool.name }}
  labels:
    {{- include "api.labels" . | nindent 4 }}
spec:
  template:
    metadata:
      labels:
        clothes-query/role: {{ .Values.name }}
    spec:
      nodeClassRef:
        group: eks.amazonaws.com
        kind: NodeClass
        name: {{ .Values.nodePool.nodeClass }}
      taints:
        - key: {{ .Values.nodePool.taintKey }}
          value: {{ .Values.name }}
          effect: NoSchedule
      requirements:
        - {key: node.kubernetes.io/instance-type, operator: In, values: {{ toJson .Values.nodePool.instanceTypes }}}
        - {key: kubernetes.io/arch, operator: In, values: ["amd64"]}
        - {key: karpenter.sh/capacity-type, operator: In, values: ["on-demand"]}
        - {key: topology.kubernetes.io/zone, operator: In, values: {{ toJson .Values.nodePool.zones }}}
  limits:
    cpu: {{ .Values.nodePool.cpuLimit | quote }}
    memory: {{ .Values.nodePool.memoryLimit }}
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 10m
    budgets:
      - nodes: "1"
{{- end }}

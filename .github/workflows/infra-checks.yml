name: Infrastructure checks

on:
  pull_request:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/infra-checks.yml"
  push:
    branches: [main, "infra/**"]
    paths:
      - "infra/**"
      - ".github/workflows/infra-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infra-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install check dependencies
        run: python -m pip install -r infra/checks/requirements.txt
      - name: Test check runner
        run: python -m unittest discover -s infra/checks/tests -v
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false
      - name: Check Terraform and mocked plans
        run: python infra/checks/check_infra.py

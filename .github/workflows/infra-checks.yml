name: Infrastructure checks

on:
  pull_request:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/infra-checks.yml"
  push:
    branches: [main, "infra/**"]
    paths:
      - "infra/**"
      - ".github/workflows/infra-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infra-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install check dependencies
        run: python -m pip install -r infra/checks/requirements.txt
      - name: Test check runner
        run: python -m unittest discover -s infra/checks/tests -v
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false
      - name: Check Terraform and mocked plans
        run: python infra/checks/check_infra.py

  kafka-helm:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install Helm check dependencies
        run: python -m pip install -r infra/platform/kafka/verify/requirements.txt
      - name: Check Helm, pinned CRDs and scrape selectors
        run: |
          helm_binary="$(python infra/checks/install_helm.py)"
          python infra/platform/kafka/verify/check.py --helm "$helm_binary"

  monitoring:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Render and check monitoring boundaries
        run: |
          python -m pip install -r infra/platform/monitoring/requirements.txt
          python -m unittest discover -s infra/platform/monitoring -p 'test_*.py' -v
          helm_binary="$(python infra/checks/install_helm.py)"
          python infra/platform/monitoring/check.py --helm "$helm_binary" --prometheus-config .cache/monitoring-prometheus.yml --alertmanager-config .cache/monitoring-alertmanager.yml
      - name: Validate Prometheus config and alert behavior without AWS
        run: |
          image=$(python -c 'import yaml; print(yaml.safe_load(open("infra/platform/monitoring/chart/values.yaml"))["prometheus"]["image"])')
          docker run --rm --network none --read-only --cap-drop ALL -v "$PWD:/workspace:ro" -w /workspace --entrypoint /bin/promtool "$image" check config --syntax-only .cache/monitoring-prometheus.yml
          docker run --rm --network none --read-only --cap-drop ALL -v "$PWD:/workspace:ro" -w /workspace --entrypoint /bin/promtool "$image" check rules infra/platform/monitoring/chart/files/rules.yaml
          docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,nodev,size=128m --cap-drop ALL -v "$PWD:/workspace:ro" -w /workspace --entrypoint /bin/promtool "$image" test rules infra/platform/monitoring/rule-tests.yaml
          alert_image=$(python -c 'import yaml; print(yaml.safe_load(open("infra/platform/monitoring/chart/values.yaml"))["alertmanager"]["image"])')
          docker run --rm --network none --read-only --cap-drop ALL -v "$PWD:/workspace:ro" -w /workspace --entrypoint /bin/amtool "$alert_image" check-config .cache/monitoring-alertmanager.yml

  kafka-local:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Test local TLS, ACL, CDC, persisted offsets and metrics
        run: python -X utf8 infra/platform/kafka/local-smoke/check.py

  connect-image-scan:
    name: Connect image scan (report only)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Scan current Connect image without registry push
        run: python -X utf8 infra/platform/kafka/image-security/check.py
      - name: Show findings without treating scan completion as release approval
        run: |
          cat .cache/connect-security/summary.md >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY'
          import json
          from pathlib import Path
          counts = json.loads(Path('.cache/connect-security/summary.json').read_text())['severityCounts']
          if counts.get('CRITICAL', 0) or counts.get('HIGH', 0):
              print('::warning::Connect image has critical/high package findings; review the scan summary.')
          PY

name: Spark preparation checks

on:
  pull_request:
    branches: [main]
    paths: ["infra/platform/spark/**", "infra/stacks/compute/deployment.auto.tfvars.json", ".github/workflows/spark-prep-checks.yml"]
  push:
    branches: [main, "infra/**"]
    paths: ["infra/platform/spark/**", "infra/stacks/compute/deployment.auto.tfvars.json", ".github/workflows/spark-prep-checks.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spark-prep-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Check disabled defaults and Spark manifests without AWS
        run: |
          python -m pip install -r infra/platform/spark/requirements.txt
          python -m unittest discover -s infra/platform/spark -p test_runtime.py -v
          python infra/platform/spark/runtime.py --output .cache/spark-dedicated.yaml
          python infra/platform/spark/runtime.py --placement shared-memory --output .cache/spark-shared.yaml

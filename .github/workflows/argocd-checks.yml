name: Argo CD configuration checks

on:
  pull_request:
    branches: [main]
    paths: ["infra/platform/argocd/**", ".github/workflows/argocd-checks.yml"]
  push:
    branches: [main, "infra/**"]
    paths: ["infra/platform/argocd/**", ".github/workflows/argocd-checks.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: argocd-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Verify chart and installation boundaries without AWS
        run: |
          python -m pip install -r infra/platform/argocd/requirements.txt
          helm_binary="$(python infra/checks/install_helm.py)"
          python infra/platform/argocd/check.py --helm "$helm_binary"

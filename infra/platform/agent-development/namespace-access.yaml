apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-developer
  namespace: agent
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, create, delete]
  - apiGroups: [""]
    resources: [pods/log, events]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [serviceaccounts]
    verbs: [get, list]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-developers
  namespace: agent
subjects:
  - kind: Group
    name: clothes-query:agent-developers
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: agent-developer
  apiGroup: rbac.authorization.k8s.io

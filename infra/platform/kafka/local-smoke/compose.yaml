# Disposable single-broker test only. No host ports or external Docker network.
services:
  postgres:
    image: postgres@sha256:0ea6700a3b4f0ae6ce746519073558aed4d88a79d8d07622a9a644946c7319c4
    platform: linux/amd64
    environment:
      POSTGRES_DB: smoke
      POSTGRES_PASSWORD: ${SMOKE_ADMIN_PASSWORD:?run check.py}
    command: [postgres, -c, wal_level=logical, -c, max_replication_slots=2, -c, max_wal_senders=2, -c, max_slot_wal_keep_size=256MB]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    mem_limit: 512m
    networks: [smoke]
  kafka:
    image: quay.io/strimzi/kafka@sha256:1f189b1f0f32684302d8b018b1d21b411e2469a9c465fbdc18fa3599cb5bbdad
    platform: linux/amd64
    environment:
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
      LOG_DIR: /tmp/kafka-app-logs
    entrypoint: [/bin/bash, -ec]
    command:
      - |
        /opt/kafka/bin/kafka-storage.sh format --standalone --cluster-id cqCdcSmokeTestCluster01 --config /mnt/server.properties --ignore-formatted
        exec /opt/kafka/bin/kafka-server-start.sh /mnt/server.properties
    volumes:
      - type: bind
        source: ./server.properties
        target: /mnt/server.properties
        read_only: true
    mem_limit: 1536m
    networks: [smoke]
  connect:
    image: ${SMOKE_CONNECT_IMAGE:?run check.py}
    platform: linux/amd64
    environment:
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
      LOG_DIR: /tmp/connect-app-logs
    entrypoint: [/opt/kafka/bin/connect-distributed.sh, /mnt/worker.properties]
    volumes:
      - type: bind
        source: ./worker.properties
        target: /mnt/worker.properties
        read_only: true
      - type: bind
        source: ${SMOKE_SECRET_DIR:?run check.py}
        target: /mnt/cdc-database
        read_only: true
    mem_limit: 1536m
    networks: [smoke]
volumes:
  postgres-data: {}
networks:
  smoke:
    internal: true

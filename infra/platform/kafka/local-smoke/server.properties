process.roles=broker,controller
node.id=1
controller.listener.names=CONTROLLER
listeners=PLAINTEXT://:9092,TLS://:9093,CONTROLLER://:9094
advertised.listeners=PLAINTEXT://kafka:9092,TLS://kafka:9093
listener.security.protocol.map=PLAINTEXT:PLAINTEXT,TLS:SSL,CONTROLLER:PLAINTEXT
inter.broker.listener.name=PLAINTEXT
controller.quorum.bootstrap.servers=kafka:9094
listener.name.tls.ssl.client.auth=required
ssl.keystore.type=PEM
ssl.keystore.location=/mnt/tls/identity.pem
ssl.truststore.type=PEM
ssl.truststore.location=/mnt/tls/ca.crt
authorizer.class.name=org.apache.kafka.metadata.authorizer.StandardAuthorizer
allow.everyone.if.no.acl.found=false
# Test-only internal admin/controller path; never use this exception in EKS.
super.users=User:ANONYMOUS
group.initial.rebalance.delay.ms=0
log.dirs=/tmp/cq-kraft-data
num.partitions=1
default.replication.factor=1
min.insync.replicas=1
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
auto.create.topics.enable=false
log.retention.hours=1

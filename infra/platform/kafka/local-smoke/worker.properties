bootstrap.servers=kafka:9092
group.id=smoke-connect
config.storage.topic=smoke-connect-configs
offset.storage.topic=smoke-connect-offsets
status.storage.topic=smoke-connect-status
config.storage.replication.factor=1
offset.storage.replication.factor=1
status.storage.replication.factor=1
offset.storage.partitions=1
status.storage.partitions=1
offset.flush.interval.ms=1000
listeners=HTTP://:8083
rest.advertised.host.name=connect
plugin.path=/opt/kafka/plugins
key.converter=org.apache.kafka.connect.json.JsonConverter
value.converter=org.apache.kafka.connect.json.JsonConverter
key.converter.schemas.enable=true
value.converter.schemas.enable=true
config.providers=directory
config.providers.directory.class=org.apache.kafka.common.config.provider.DirectoryConfigProvider
config.providers.directory.param.allowed.paths=/mnt/cdc-database
connector.client.config.override.policy=None
topic.creation.enable=false

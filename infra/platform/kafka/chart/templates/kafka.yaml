{{- include "cq.check" . -}}
{{- if .Values.kafka.enabled }}
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: combined
  labels:
    strimzi.io/cluster: {{ .Values.kafka.name }}
spec:
  replicas: {{ .Values.kafka.replicas }}
  roles: [controller, broker]
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        kraftMetadata: shared
        class: {{ .Values.kafka.storageClass }}
        size: {{ printf "%vGi" .Values.kafka.storageGi }}
        deleteClaim: false
  resources:
    {{- toYaml .Values.kafka.resources | nindent 4 }}
  jvmOptions:
    "-Xms": {{ printf "%vm" .Values.kafka.heapMi | quote }}
    "-Xmx": {{ printf "%vm" .Values.kafka.heapMi | quote }}
  template:
    pod:
      terminationGracePeriodSeconds: 120
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: karpenter.sh/nodepool
                    operator: In
                    values: [{{ .Values.kafka.nodePool | quote }}]
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  strimzi.io/cluster: {{ .Values.kafka.name }}
                  strimzi.io/pool-name: combined
      topologySpreadConstraints:
        - maxSkew: 1
          minDomains: 2
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              strimzi.io/cluster: {{ .Values.kafka.name }}
              strimzi.io/pool-name: combined
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: {{ .Values.kafka.name }}
spec:
  kafka:
    version: {{ .Values.kafka.version | quote }}
    image: {{ .Values.kafka.image | quote }}
    brokerRackInitImage: quay.io/strimzi/operator@sha256:4deb564fa329afa4046c550a6f8f1a6d00be3b9297e556969acabe6647b6676f
    rack:
      type: topology-label
      topologyKey: topology.kubernetes.io/zone
    listeners:
      - name: tls
        port: 9093
        type: internal
        tls: true
        authentication:
          type: tls
        networkPolicyPeers:
          - podSelector:
              matchLabels:
                strimzi.io/cluster: {{ .Values.connect.name }}
                strimzi.io/kind: KafkaConnect
          {{- range .Values.kafka.clientNamespaces }}
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: {{ . | quote }}
          {{- end }}
    authorization:
      type: simple
    config:
      default.replication.factor: 3
      min.insync.replicas: 2
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      auto.create.topics.enable: false
      unclean.leader.election.enable: false
      log.retention.hours: {{ .Values.kafka.retentionHours }}
    template:
      podDisruptionBudget:
        maxUnavailable: 1
  entityOperator:
    topicOperator:
      image: quay.io/strimzi/operator@sha256:4deb564fa329afa4046c550a6f8f1a6d00be3b9297e556969acabe6647b6676f
    userOperator:
      image: quay.io/strimzi/operator@sha256:4deb564fa329afa4046c550a6f8f1a6d00be3b9297e556969acabe6647b6676f
{{- end }}

{{- if .Values.kafka.enabled }}
{{- range .Values.topics }}
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: {{ default .name .resourceName }}
  labels:
    strimzi.io/cluster: {{ $.Values.kafka.name }}
spec:
  topicName: {{ .name | quote }}
  partitions: {{ .partitions }}
  replicas: {{ include "cq.replicationFactor" $ }}
  config:
    min.insync.replicas: {{ include "cq.minIsr" $ }}
    retention.ms: {{ printf "%.0f" (float64 .retentionMs) }}
    cleanup.policy: delete
{{- end }}
{{- if .Values.connect.enabled }}
{{- range $suffix := list "configs" "offsets" "status" }}
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: {{ $.Values.connect.name }}-{{ $suffix }}
  labels:
    strimzi.io/cluster: {{ $.Values.kafka.name }}
spec:
  topicName: {{ printf "%s-%s" $.Values.connect.name $suffix | quote }}
  partitions: 1
  replicas: {{ include "cq.replicationFactor" $ }}
  config:
    min.insync.replicas: {{ include "cq.minIsr" $ }}
    cleanup.policy: compact
{{- end }}
{{- end }}
{{- end }}

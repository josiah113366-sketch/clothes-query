# Import as scrape_configs entries in a separately selected in-cluster collector.
# Default cluster/Connect/pool names only; edit selectors if those names change.
- job_name: clothes-query-kafka
  scrape_interval: 30s
  scrape_timeout: 10s
  kubernetes_sd_configs:
    - role: pod
      namespaces:
        names: [kafka]
  relabel_configs:
    - source_labels: [__meta_kubernetes_pod_phase]
      regex: Running
      action: keep
    - source_labels: [__meta_kubernetes_pod_label_strimzi_io_cluster]
      regex: clothes-query-dev-kafka
      action: keep
    - source_labels: [__meta_kubernetes_pod_label_strimzi_io_pool_name]
      regex: combined
      action: keep
    - source_labels: [__meta_kubernetes_pod_container_port_name]
      regex: tcp-prometheus
      action: keep
    - source_labels: [__meta_kubernetes_namespace]
      target_label: namespace
    - source_labels: [__meta_kubernetes_pod_name]
      target_label: pod
- job_name: clothes-query-connect
  scrape_interval: 30s
  scrape_timeout: 10s
  kubernetes_sd_configs:
    - role: pod
      namespaces:
        names: [kafka]

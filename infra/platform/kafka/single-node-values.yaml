# Opt-in disposable/development profile. No runtime is enabled by this file alone.
# Do not switch an existing RF=3 cluster to this profile or shrink an existing PVC.
profile: single-node
kafka:
  enabled: false
  replicas: 1
  storageGi: 20
  retentionHours: 72
  # retentionHours is a fallback only; never render both aliases for Strimzi.
  # Effective retention: 168 hours / 7 days.
  retentionMs: 604800000
  resources:
    requests: {cpu: "500m", memory: "1536Mi"}
    limits: {cpu: "1", memory: "1536Mi"}
  heapMi: 512
  # Keep the only broker on its existing node during voluntary consolidation.
  # Planned broker maintenance must explicitly review/release this protection.
  podDisruptionBudgetMaxUnavailable: 0
  entityOperatorResources:
    requests: {cpu: "50m", memory: "256Mi"}
    limits: {cpu: "500m", memory: "384Mi"}
# Set retentionMs: 604800000 on every business topic in runtime values.
# Topic-level retention overrides retentionHours; topics remain unspecified here.
connect:
  enabled: false
  replicas: 1
  resources:
    requests: {cpu: "250m", memory: "1Gi"}
    limits: {cpu: "1", memory: "1Gi"}
  heapMi: 512
metrics:
  lagExporter:
    resources:
      requests: {cpu: "25m", memory: "128Mi"}
      limits: {cpu: "500m", memory: "256Mi"}
ui:
  resources:
    requests: {cpu: "25m", memory: "256Mi"}
    limits: {cpu: "500m", memory: "512Mi"}

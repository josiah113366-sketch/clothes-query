    target_label: pod
  sample_limit: 10000
- job_name: clothes-query-kafka-lag
  scrape_interval: 60s
  scrape_timeout: 10s
  kubernetes_sd_configs:
  - role: pod
    namespaces:
      names:
      - kafka
  relabel_configs:
  - source_labels:

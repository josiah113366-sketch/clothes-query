{{- range $name := list "prometheus" "grafana" "metricsServer" }}
{{- $cfg := index $.Values $name }}
{{- if or (ne $name "metricsServer") $cfg.enabled }}
{{- $component := ternary "metrics-server" $name (eq $name "metricsServer") }}
{{- if not (regexMatch "^.+@sha256:[a-f0-9]{64}$" $cfg.image) }}
{{- fail "All monitoring images must be pinned by sha256 digest" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitoring-{{ $component }}
  namespace: {{ $.Release.Namespace }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: monitoring-{{ $component }}}
  template:
    metadata:
      labels: {app: monitoring-{{ $component }}}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") $ | sha256sum }}
    spec:
      {{- if ne $name "grafana" }}
      serviceAccountName: monitoring-{{ $component }}
      {{- else }}
      automountServiceAccountToken: false
      {{- end }}
      nodeSelector:
        karpenter.sh/nodepool: {{ $.Values.nodePool.name }}
      tolerations:
        - key: {{ $.Values.nodePool.taintKey }}
          operator: Equal
          value: {{ $.Values.nodePool.taintValue }}
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        {{- if eq $name "grafana" }}
        runAsUser: 472
        fsGroup: 472
        {{- else if eq $name "prometheus" }}
        runAsUser: 65534
        fsGroup: 65534
        {{- else }}
        runAsUser: 1000
        fsGroup: 1000
        {{- end }}
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: {{ $component }}
          image: {{ $cfg.image }}
          resources:
            {{- toYaml $cfg.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          {{- if eq $name "prometheus" }}
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time={{ $cfg.retentionTime }}
            - --storage.tsdb.retention.size={{ $cfg.retentionSize }}
            - --query.max-concurrency=4
            - --query.max-samples=1000000
          ports: [{name: http, containerPort: 9090}]
          readinessProbe: {httpGet: {path: /-/ready, port: http}, initialDelaySeconds: 10}
          livenessProbe: {httpGet: {path: /-/healthy, port: http}, initialDelaySeconds: 30}
          volumeMounts:
            - {name: data, mountPath: /prometheus}
            - {name: config, mountPath: /etc/prometheus, readOnly: true}
            - {name: tmp, mountPath: /tmp}
          {{- else if eq $name "grafana" }}
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom: {secretKeyRef: {name: {{ $cfg.adminSecret }}, key: username}}
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ $cfg.adminSecret }}, key: password}}
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "false"}
            - {name: GF_USERS_ALLOW_SIGN_UP, value: "false"}
            - {name: GF_ANALYTICS_REPORTING_ENABLED, value: "false"}
            - {name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: "false"}
            - {name: GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES, value: "false"}
            # Bundled data sources are read-only; keep the versions shipped in the image.
            - {name: GF_PLUGINS_PREINSTALL_AUTO_UPDATE, value: "false"}
            - {name: GF_NEWS_NEWS_FEED_ENABLED, value: "false"}
          ports: [{name: http, containerPort: 3000}]
          readinessProbe: {httpGet: {path: /api/health, port: http}, initialDelaySeconds: 15}
          livenessProbe: {httpGet: {path: /api/health, port: http}, initialDelaySeconds: 60}
          volumeMounts:
            - {name: data, mountPath: /var/lib/grafana}
            - {name: config, mountPath: /etc/grafana/provisioning/datasources/datasources.yaml, subPath: datasources.yaml, readOnly: true}
            - {name: config, mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml, subPath: dashboards.yaml, readOnly: true}
            - {name: dashboard, mountPath: /etc/grafana/infra-dashboards, readOnly: true}
            - {name: tmp, mountPath: /tmp}
          {{- else }}
          args:
            - --cert-dir=/tmp
            - --secure-port=10250
            - --kubelet-preferred-address-types=InternalIP,Hostname
            - --kubelet-use-node-status-port
            - --metric-resolution=30s
          ports: [{name: https, containerPort: 10250}]
          readinessProbe:
            httpGet: {path: /readyz, port: https, scheme: HTTPS}
            initialDelaySeconds: 30
          livenessProbe:
            httpGet: {path: /livez, port: https, scheme: HTTPS}
            initialDelaySeconds: 30
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
          {{- end }}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 128Mi}
        {{- if ne $name "metricsServer" }}
        - name: data
          persistentVolumeClaim: {claimName: monitoring-{{ $component }}}
        - name: config
          configMap: {name: monitoring-{{ $component }}{{ ternary "-provisioning" "" (eq $name "grafana") }}}
        {{- end }}
        {{- if eq $name "grafana" }}
        - name: dashboard
          configMap: {name: monitoring-grafana-dashboard}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: monitoring-{{ $component }}
  namespace: {{ $.Release.Namespace }}
spec:
  type: ClusterIP
  selector: {app: monitoring-{{ $component }}}
  ports:
    {{- if eq $name "metricsServer" }}
    - {name: https, port: 443, targetPort: https}
    {{- else }}
    - {name: http, port: {{ ternary 3000 9090 (eq $name "grafana") }}, targetPort: http}
    {{- end }}
---
{{- end }}
{{- end }}

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clothes-query-review-simulator"
version = "0.3.0"
requires-python = ">=3.12"
# Bedrock 호출은 표준 라이브러리(urllib)로 해서 SDK 가 필요 없다. boto3 는 S3 레이크 저장에만, psycopg 는 RDS 주문 읽기에만 쓴다.
dependencies = [
    "boto3",  # S3 레이크 저장 (--sink lake 에 s3:// 경로를 줄 때)
    "confluent-kafka",
    "psycopg[binary]",  # RDS orders 테이블 읽기 (--source rds, 2026-10-21). 읽기만 한다
    "python-dotenv",
    "typer",
]

[project.optional-dependencies]
dev = [
    # 가짜 AWS: S3 저장 테스트 + ECS 배포 스크립트(deploy/) 테스트
    "moto[s3,ssm,ecs,secretsmanager,logs,scheduler,iam]",
    "pytest",
    "ruff",
]

[project.scripts]
rsim = "rsim.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# 모델 단가표(벤치마크 비용 계산용)
"rsim.bench" = ["prices.json"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

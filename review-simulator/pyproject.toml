[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clothes-query-review-simulator"
version = "0.1.0"
requires-python = ">=3.12"
# Bedrock 호출은 표준 라이브러리(urllib)로 해서 SDK 가 필요 없다. boto3 는 S3 레이크 저장에만 쓴다.
dependencies = [
    "boto3",  # S3 레이크 저장 (--sink lake 에 s3:// 경로를 줄 때)
    "confluent-kafka",
    "python-dotenv",
    "typer",
]

[project.optional-dependencies]
dev = [
    "moto[s3]",  # S3 저장 테스트용 가짜 S3
    "pytest",
    "ruff",
]

[project.scripts]
rsim = "rsim.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# 모델 단가표(벤치마크 비용 계산용)
"rsim.bench" = ["prices.json"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

# Gold B 적재 잡 설정 (pipelines/gold_b/jobs/streaming_ingest.py가 읽는다).
# 주소·버킷 이름은 여기에 넣지 않는다. 원장 저장 위치·체크포인트·Kafka 주소는 환경변수로 받는다 (jobs/README.md).
# PG 같은 허용 값은 공통 규칙표(docs/contracts/format_rules.yaml)에 있다.

# 읽을 Kafka 토픽 (설계: 6개 토픽). Kafka에 없는 토픽은 새로 만들지 않고, 나중에 생기면 그때부터 읽는다.
topics:
  - payments
  - orders
  - order-items
  - members-events
  - clickstream
  - reviews.raw

# 묶음 하나를 처리하는 주기(초). 설계: 1분
trigger_seconds: 60

# 체크포인트가 없을 때(처음 시작할 때) 읽기 시작할 곳.
# earliest: Kafka에 남은 가장 오래된 메시지부터 (보관 기간 7일), latest: 지금부터
starting_offsets: earliest

# 묶음 하나에 읽는 최대 메시지 수. 밀린 메시지를 한 번에 다 읽어 메모리가 넘치지 않게 한다
max_offsets_per_trigger: 20000

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clothes-query-simulator"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "boto3",
    "confluent-kafka",
    "faker",
    "psycopg[binary]",
    "pyarrow",
    "python-dotenv",
    "typer",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
sim = "sim.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m \"not integration\""
markers = [
    "integration: 로컬 PostgreSQL 또는 Kafka가 필요한 통합 테스트",
]
